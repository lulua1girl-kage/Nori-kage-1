name: Build Nori Simple APK
on:
  push:
    branches: [jarvis-11.4.0-apk]
  workflow_dispatch:
concurrency:
  group: nori-simple-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Nori web assets
        run: |
          mkdir -p android-app/app/src/main/assets
          cp -R jarvis/public/. android-app/app/src/main/assets/
      - name: Validate JavaScript
        run: |
          cd jarvis
          npm run check
      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        working-directory: android-app
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nori-simple-11.5.0-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error