name: Build Nori Simple APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare web assets
        run: |
          mkdir -p android-app/app/src/main/assets
          cp -R jarvis/public/. android-app/app/src/main/assets/
          sed -i 's#href="/styles.css"#href="styles.css"#' android-app/app/src/main/assets/index.html
          sed -i 's#src="/nori.js"#src="nori.js"#' android-app/app/src/main/assets/index.html
          cat > android-app/app/src/main/assets/api.js <<'EOF'
export async function version(){
  return {jarvisVersion:'11.4.0',providerModels:{},offline:true};
}
export async function chat(){
  return {text:'I’m Nori. The standalone app is running locally. Connect a Nori backend to enable external AI.',provider:'LOCAL',model:'offline'};
}
EOF

      - name: Build APK
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 9.6.0
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nori-simple-11.4.0-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error