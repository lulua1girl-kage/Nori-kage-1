name: Build Nori Jarvis

on:
  push:
    branches: [jarvis-*]
  workflow_dispatch:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: npm run check
      - name: Package
        run: |
          mkdir -p ../dist
          zip -r ../dist/nori-jarvis-${{ github.sha }}.zip . -x "node_modules/*"
      - name: Upload Jarvis artifact
        uses: actions/upload-artifact@v4
        with:
          name: nori-jarvis-${{ github.ref_name }}-${{ github.sha }}"
          path: jarvis/../dist/*.zip
          if-no-files-found: error
