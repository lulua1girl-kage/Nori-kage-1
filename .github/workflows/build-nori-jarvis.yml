name: Build Nori Jarvis

on:
  push:
    branches: ['jarvis-*']
  workflow_dispatch:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        working-directory: jarvis
        run: npm run check

      - name: Package web build
        working-directory: jarvis
        run: |
          mkdir -p ../dist
          zip -r ../dist/nori-jarvis-${{ github.sha }}.zip . -x "node_modules/*"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android assets
        run: |
          mkdir -p android-app/app/src/main/assets
          cp -R jarvis/public/. android-app/app/src/main/assets/
          sed -i 's#href="/styles.css"#href="styles.css"#' android-app/app/src/main/assets/index.html
          sed -i 's#src="/nori.js"#src="nori.js"#' android-app/app/src/main/assets/index.html
          cat > android-app/app/src/main/assets/api.js <<'EOF'
export async function version(){
  try{const r=await fetch('/api/version');if(r.ok)return r.json()}catch{}
  return {jarvisVersion:'11.4.0',providerModels:{},offline:true}
}
export async function chat(messages,capability='conversation'){
  const backend=localStorage.getItem('nori_backend_url')||'';
  if(!backend)return {text:'I’m Nori. The standalone app is running, but an AI provider connection has not been configured yet. Voice, text, memory and local Nori systems are available.',provider:'LOCAL',model:'offline'};
  const r=await fetch(backend.replace(/\/$/,'')+'/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages,capability})});
  const j=await r.json();if(!r.ok)throw Error(j.error||'AI provider unavailable');return j
}
EOF

      - name: Build Android APK
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 9.6.0
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: nori-jarvis-${{ github.ref_name }}-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nori-simple-11.4.0-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
