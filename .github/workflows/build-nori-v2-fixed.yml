name: Build Nori v2 Fixed APK

# Re-runable maintained APK build: every main push and manual dispatch creates a fresh artifact.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Nori v2 Fixed artifact
        uses: actions/checkout@v4
      - name: Prepare source without changing Nori code
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          unzip -q nori-v2-fixed.zip -d build
          test -d build/fixed
          cd build/fixed
          mkdir -p resources www
          cp ../../expr-concerned.jpg resources/icon.jpg
          find . -mindepth 1 -maxdepth 1 ! -name www ! -name android ! -name node_modules -exec cp -a {} www/ \;
          cp ../../nori-modern/index.html www/index.html
          cp ../../nori-modern/voice.js www/voice.js
          cp ../../nori-modern/nori-core.js www/nori-core.js
          cp ../../nori-modern/nori-core.js nori-core.js
          cp ../../nori-modern/nori-core.test.js nori-core.test.js
          node nori-core.test.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html'); x=p.read_text()
          marker='<script>'
          if marker not in x: raise SystemExit('Nori modern script anchor missing')
          p.write_text(x.replace(marker,'<script src="voice.js"></script>'+marker,1))
          PY
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));p.webDir='www';fs.writeFileSync('capacitor.config.json',JSON.stringify(p,null,2)+'\\n')"
          cd ../..
          sha256sum nori-v2-fixed.zip expr-concerned.jpg > build/source-checksums.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: build/fixed
        run: |
          npm install --no-audit --no-fund
          npm install --save-exact @capacitor-community/speech-recognition@6.0.1 @capacitor-community/text-to-speech@4.1.1
      - name: Patch Android voice bridge
        working-directory: build/fixed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('nori-native-bridge.js'); s=p.read_text()
          old='''function noriSpeak(text, options) {\n  if (!window.speechSynthesis) return;\n  options = options || {};'''
          new='''function noriSpeak(text, options) {\n  options = options || {};\n  if (NORI_IS_NATIVE) {\n    const P = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech;\n    if (P && P.speak) return P.speak({text:String(text||''),lang:'en-US',rate:options.rate==null?0.98:options.rate,pitch:options.pitch==null?1:options.pitch,volume:1,category:'ambient',queueStrategy:1});\n  }\n  if (!window.speechSynthesis) return;'''
          if old not in s: raise SystemExit('noriSpeak anchor not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Create Android wrapper
        working-directory: build/fixed
        run: npx cap add android
      - name: Generate Android launcher icons
        working-directory: build/fixed
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('resources/icon.jpg').convert('RGBA')
          im.save('resources/icon.png')
          PY
          rm resources/icon.jpg
          npx -y @capacitor/assets generate --android
      - name: Sync web artifact
        working-directory: build/fixed
        run: npx cap sync android
      - name: Build debug APK
        working-directory: build/fixed/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK exists
        run: |
          set -euo pipefail
          test -f build/fixed/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum build/fixed/android/app/build/outputs/apk/debug/app-debug.apk > build/apk-sha256.txt
      - name: Upload maintained APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nori-v2-Fixed-APK
          path: |
            build/fixed/android/app/build/outputs/apk/debug/app-debug.apk
            build/source-checksums.txt
            build/apk-sha256.txt
          if-no-files-found: error
          retention-days: 90
