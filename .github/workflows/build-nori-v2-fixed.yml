name: Build Nori v2 Fixed APK

# Re-runable maintained APK build: every main push and manual dispatch creates a fresh artifact.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Nori v2 Fixed artifact
        uses: actions/checkout@v4
      - name: Prepare source without changing Nori code
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          unzip -q nori-v2-fixed.zip -d build
          test -d build/fixed
          cd build/fixed
          mkdir -p resources www
          cp ../../expr-concerned.jpg resources/icon.jpg
          find . -mindepth 1 -maxdepth 1 ! -name www ! -name android ! -name node_modules -exec cp -a {} www/ \;
          cp ../../nori-modern/index.html www/index.html
          cp ../../nori-modern/voice.js www/voice.js
          cp ../../nori-modern/nori-core.js www/nori-core.js
          cp ../../nori-modern/nori-checkin-scheduler.js www/nori-checkin-scheduler.js
          cp ../../nori-modern/nori-core.js nori-core.js
          cp ../../nori-modern/nori-core.test.js nori-core.test.js
          node nori-core.test.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html'); x=p.read_text()
          marker='<script>'
          if marker not in x: raise SystemExit('Nori modern script anchor missing')
          p.write_text(x.replace(marker,'<script src="voice.js"></script>'+marker,1))
          PY
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));p.webDir='www';fs.writeFileSync('capacitor.config.json',JSON.stringify(p,null,2)+'\\n')"
          cd ../..
          sha256sum nori-v2-fixed.zip expr-concerned.jpg > build/source-checksums.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: build/fixed
        run: |
          npm install --no-audit --no-fund
          npm install --save-exact @capacitor-community/speech-recognition@6.0.1 @capacitor-community/text-to-speech@4.1.1
      - name: Patch Android voice bridge
        working-directory: build/fixed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('nori-native-bridge.js'); s=p.read_text()
          old='''function noriSpeak(text, options) {\n  if (!window.speechSynthesis) return;\n  options = options || {};'''
          new='''function noriSpeak(text, options) {\n  options = options || {};\n  if (NORI_IS_NATIVE) {\n    const P = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech;\n    if (P && P.speak) return P.speak({text:String(text||''),lang:'en-US',rate:options.rate==null?0.98:options.rate,pitch:options.pitch==null?1:options.pitch,volume:1,category:'ambient',queueStrategy:1});\n  }\n  if (!window.speechSynthesis) return;'''
          if old not in s: raise SystemExit('noriSpeak anchor not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Create Android wrapper
        working-directory: build/fixed
        run: npx cap add android
      - name: Patch Android Nori daily check-in bridge
        working-directory: build/fixed
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/com/nori/kage/scheduler
          cp ../../nori-native-scheduler/NoriAlarmScheduler.kt android/app/src/main/java/com/nori/kage/scheduler/
          cp ../../nori-native-scheduler/NoriCheckInReceiver.kt android/app/src/main/java/com/nori/kage/scheduler/
          cp ../../nori-native-scheduler/NoriBootReceiver.kt android/app/src/main/java/com/nori/kage/scheduler/
          cp ../../nori-native-scheduler/NoriSchedulerPlugin.kt android/app/src/main/java/com/nori/kage/scheduler/
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          perms = [
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />'
          ]
          insert = '\n'.join(p for p in perms if p not in s)
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s = s.replace('<manifest', '<manifest', 1)
              s = re.sub(r'(<manifest[^>]*>\n)', r'\\1' + insert + '\n', s, count=1)
          receivers = '''        <receiver android:name="com.nori.kage.scheduler.NoriCheckInReceiver" android:exported="false" />
          <receiver android:name="com.nori.kage.scheduler.NoriBootReceiver" android:enabled="true" android:exported="false">
              <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED" />
                  <action android:name="android.intent.action.TIME_SET" />
                  <action android:name="android.intent.action.TIMEZONE_CHANGED" />
                  <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                  <action android:name="android.app.action.SCHEDULE_EXACT_ALARM_PERMISSION_STATE_CHANGED" />
              </intent-filter>
          </receiver>'''
          if 'NoriCheckInReceiver' not in s:
              s=s.replace('</application>', receivers+'\n    </application>')
          manifest.write_text(s)
          main = next(Path('android/app/src/main/java').rglob('MainActivity.java'), None)
          if main:
              x=main.read_text()
              if 'NoriSchedulerPlugin' not in x:
                  x=x.replace('package ', 'package ', 1)
                  x=re.sub(r'(package [^;]+;\n)', r'\\1import com.nori.kage.scheduler.NoriSchedulerPlugin;\n', x, count=1)
                  if 'onCreate(' in x:
                      x=x.replace('onCreate(Bundle savedInstanceState) {', 'onCreate(Bundle savedInstanceState) {\n        registerPlugin(NoriSchedulerPlugin.class);', 1)
                  else:
                      if 'import android.os.Bundle;' not in x:
                          x=re.sub(r'(package [^;]+;\n)', r'\\1import android.os.Bundle;\n', x, count=1)
                      x=x.replace('}', '    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(NoriSchedulerPlugin.class);\n        super.onCreate(savedInstanceState);\n    }\n}', 1)
                  main.write_text(x)
          else:
              main = next(Path('android/app/src/main/java').rglob('MainActivity.kt'), None)
              if main:
                  x=main.read_text()
                  if 'NoriSchedulerPlugin' not in x:
                      x=x.replace('package ', 'package ', 1)
                      x=re.sub(r'(package [^\n]+\n)', r'\\1import android.os.Bundle\nimport com.nori.kage.scheduler.NoriSchedulerPlugin\n', x, count=1)
                      if 'override fun onCreate' in x:
                          x=x.replace('{\n', '{\n        registerPlugin(NoriSchedulerPlugin::class.java)\n', 1)
                      else:
                          x=x.replace('}', '    override fun onCreate(savedInstanceState: Bundle?) {\n        registerPlugin(NoriSchedulerPlugin::class.java)\n        super.onCreate(savedInstanceState)\n    }\n}', 1)
                      main.write_text(x)
              else:
                  raise SystemExit('MainActivity.java/kt not found')
          PY

      - name: Generate Android launcher icons
        working-directory: build/fixed
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('resources/icon.jpg').convert('RGBA')
          im.save('resources/icon.png')
          PY
          rm resources/icon.jpg
          npx -y @capacitor/assets generate --android
      - name: Sync web artifact
        working-directory: build/fixed
        run: npx cap sync android
      - name: Build debug APK
        working-directory: build/fixed/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK exists
        run: |
          set -euo pipefail
          test -f build/fixed/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum build/fixed/android/app/build/outputs/apk/debug/app-debug.apk > build/apk-sha256.txt
      - name: Upload maintained APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nori-v2-Fixed-APK
          path: |
            build/fixed/android/app/build/outputs/apk/debug/app-debug.apk
            build/source-checksums.txt
            build/apk-sha256.txt
          if-no-files-found: error
          retention-days: 90
