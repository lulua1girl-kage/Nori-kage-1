name: Build Nori v2 Fixed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Nori v2 Fixed artifact
        uses: actions/checkout@v4

      - name: Prepare source without changing Nori code
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          unzip -q nori-v2-fixed.zip -d build
          test -d build/fixed
          cd build/fixed
          mkdir -p resources
          cp ../../expr-concerned.jpg resources/icon.jpg
          mkdir -p www
          find . -mindepth 1 -maxdepth 1 ! -name www ! -name android ! -name node_modules -exec cp -a {} www/ \;
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));p.webDir='www';fs.writeFileSync('capacitor.config.json',JSON.stringify(p,null,2)+'\\n')"
          cd ../..
          sha256sum nori-v2-fixed.zip expr-concerned.jpg > build/source-checksums.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies and Android voice plugins
        working-directory: build/fixed
        run: |
          npm install --no-audit --no-fund
          npm install --save-exact @capacitor-community/speech-recognition@6.0.1 @capacitor-community/text-to-speech@4.1.1

      - name: Patch Android voice bridge only (original ZIP remains unchanged)
        working-directory: build/fixed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('nori-native-bridge.js')
          s=p.read_text()
          old='''function noriSpeak(text, options) {\n  if (!window.speechSynthesis) return;\n  options = options || {};'''
          new='''function noriSpeak(text, options) {\n  options = options || {};\n  if (NORI_IS_NATIVE) {\n    const P = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech;\n    if (P && P.speak) {\n      try { document.dispatchEvent(new CustomEvent('nori:voice-state',{detail:{state:'SPEAKING',transcript:text}})); } catch(e) {}\n      if (window.NoriInteractivePresence && window.NoriInteractivePresence.setState) window.NoriInteractivePresence.setState('SPEAKING');\n      if (options.onStart) options.onStart();\n      return P.speak({text:String(text||''),lang:'en-US',rate:options.rate==null?0.98:options.rate,pitch:options.pitch==null?1:options.pitch,volume:1,category:'ambient',queueStrategy:1}).then(function(){\n        if (window.NoriInteractivePresence && window.NoriInteractivePresence.setState) window.NoriInteractivePresence.setState('IDLE');\n        try { document.dispatchEvent(new CustomEvent('nori:voice-state',{detail:{state:'IDLE'}})); } catch(e) {}\n        if (options.onEnd) options.onEnd();\n      }).catch(function(err){\n        if (options.onError) options.onError(err);\n      });\n    }\n  }\n  if (!window.speechSynthesis) { if (options.onError) options.onError(new Error('speech-unavailable')); return; }'''
          if old not in s: raise SystemExit('noriSpeak anchor not found')
          p.write_text(s.replace(old,new))

          p=Path('nori-voice-v28.js')
          s=p.read_text()
          old='''  async function speak(text,opts){opts=opts||{};var engine=opts.engine||state.engine;try{if(engine==='piper'||engine==='xtts')return await localSpeak(engine,text);'''
          new='''  async function speak(text,opts){opts=opts||{};var engine=opts.engine||state.engine;try{\n    if(g.NORI_IS_NATIVE && g.Capacitor && g.Capacitor.Plugins && g.Capacitor.Plugins.TextToSpeech && g.Capacitor.Plugins.TextToSpeech.speak){\n      await g.Capacitor.Plugins.TextToSpeech.speak({text:String(text||''),lang:opts.language||state.language||'en-US',rate:Number(opts.rate||state.rate)||0.98,pitch:Number(opts.pitch||1)||1,volume:Number(state.volume)||1,category:'ambient',queueStrategy:1});\n      return {engine:'native-tts'};\n    }\n    if(engine==='piper'||engine==='xtts')return await localSpeak(engine,text);'''
          if old not in s: raise SystemExit('noriVoice speak anchor not found')
          p.write_text(s.replace(old,new))
          PY

      - name: Create Android wrapper
        working-directory: build/fixed
        run: npx cap add android

      - name: Generate Android launcher icons from expr-concerned
        working-directory: build/fixed
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('resources/icon.jpg').convert('RGBA')
          im.save('resources/icon.png')
          PY
          rm resources/icon.jpg
          npx -y @capacitor/assets generate --android

      - name: Sync exact web artifact
        working-directory: build/fixed
        run: npx cap sync android

      - name: Build debug APK
        working-directory: build/fixed/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          set -euo pipefail
          test -f build/fixed/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum build/fixed/android/app/build/outputs/apk/debug/app-debug.apk > build/apk-sha256.txt

      - name: Upload maintained APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nori-v2-Fixed-APK
          path: |
            build/fixed/android/app/build/outputs/apk/debug/app-debug.apk
            build/source-checksums.txt
            build/apk-sha256.txt
          if-no-files-found: error
          retention-days: 90
